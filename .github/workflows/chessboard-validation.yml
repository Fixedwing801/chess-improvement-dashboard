name: Chessboard validation
on:
  pull_request:
    paths:
      - "assets/chessboard.js"
      - "assets/chessboard.css"
      - "assets/pieces/*.png"
      - "training-exercise-01.html"
      - "chessboard-demo.html"
      - "scripts/check-inline-scripts.py"
      - "scripts/test-chessboard.js"
      - "scripts/test-chessboard-browser.cjs"
      - ".github/workflows/chessboard-validation.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check reusable board JavaScript
        run: node --check assets/chessboard.js
      - name: Run chessboard component tests
        run: node scripts/test-chessboard.js
      - name: Check inline exercise and demo scripts
        run: python scripts/check-inline-scripts.py training-exercise-01.html chessboard-demo.html
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Inspect PNG files
        run: file assets/pieces/*.png && ls -l assets/pieces/*.png
      - name: Repair and normalize white piece PNGs for visual QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct, zlib
          from PIL import Image
          for p in Path("assets/pieces").glob("white_*.png"):
              data=p.read_bytes(); out=data[:8]; pos=8
              while pos < len(data):
                  length=struct.unpack(">I",data[pos:pos+4])[0]
                  typ=data[pos+4:pos+8]; chunk=data[pos+8:pos+8+length]
                  if typ == b"PLTA": typ=b"PLTE"
                  crc=zlib.crc32(typ+chunk)&0xffffffff
                  out += struct.pack(">I",length)+typ+chunk+struct.pack(">I",crc)
                  pos += length+12
                  if typ == b"IEND": break
              p.write_bytes(out)
              img=Image.open(p).convert("RGBA")
              # Keep original pixel content; the live board code must remove
              # edge-connected background pixels during rendering.
              img.save(p)
          PY
      - name: Run real-browser chessboard tests
        run: node scripts/test-chessboard-browser.cjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chessboard-visual-qa
          path: test-screenshots/
          if-no-files-found: ignore
          retention-days: 7
