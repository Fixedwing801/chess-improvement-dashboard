name: Chessboard validation
on:
  pull_request:
    paths:
      - "assets/chessboard.js"
      - "assets/chessboard.css"
      - "training-exercise-01.html"
      - "chessboard-demo.html"
      - "scripts/check-inline-scripts.py"
      - "scripts/test-chessboard.js"
      - "scripts/test-chessboard-browser.cjs"
      - ".github/workflows/chessboard-validation.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check reusable board JavaScript
        run: node --check assets/chessboard.js
      - name: Run chessboard component tests
        run: node scripts/test-chessboard.js
      - name: Check inline exercise and demo scripts
        run: python scripts/check-inline-scripts.py training-exercise-01.html chessboard-demo.html
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Normalize white piece PNG transparency for visual QA
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in Path("assets/pieces").glob("white_*.png"):
              im=Image.open(p).convert("RGBA")
              im.save(p)
          PY
      - name: Run real-browser chessboard tests
        run: node scripts/test-chessboard-browser.cjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chessboard-visual-qa
          path: test-screenshots/
          if-no-files-found: ignore
          retention-days: 7
