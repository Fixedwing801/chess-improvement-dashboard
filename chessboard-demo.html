<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171a1f">
<title>Chessboard Component Demo · Chess Improvement Lab</title>
<link rel="stylesheet" href="assets/chessboard.css">
<style>
:root{color-scheme:dark;--bg:#171a1f;--panel:#22262d;--line:#3a414b;--ink:#f0eee8;--muted:#b9b6ad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#343941,transparent 55%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:900px;margin:auto;padding:22px 16px 40px}.panel{background:linear-gradient(145deg,#282d35,#20242b);border:1px solid var(--line);border-radius:18px;padding:clamp(12px,2.5vw,22px);box-shadow:0 14px 40px #0005}
h1{font-size:clamp(24px,4vw,34px);margin:3px 0 14px}.muted{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
button.control{border:1px solid #59616c;background:#303640;color:#f2efe7;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}
.status{border-top:1px solid var(--line);padding-top:12px;color:var(--muted)}
@media(max-width:600px){main{padding:14px 10px 28px}.panel{padding:10px}}
</style>
</head>
<body><main>
<p class="muted">Chess Improvement Lab · Component verification</p>
<h1>Reusable interactive chessboard</h1>
<section class="panel">
<div id="board"></div>
<div class="controls">
<button class="control" id="back">Back</button>
<button class="control" id="forward">Forward</button>
<button class="control" id="flip">Flip board</button>
<button class="control" id="reset">Reset</button>
</div>
<div class="status" id="status" aria-live="polite">Loading chessboard…</div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="assets/chessboard.js"></script>
<script>
(() => {
  const startFen = new Chess().fen();
  let game = new Chess();
  let history = [];
  let cursor = 0;
  const status = document.getElementById("status");
  const board = ChessBoard.mount(document.getElementById("board"), {
    getGame: () => game,
    orientation: "white",
    onMove: () => { history = game.history(); cursor = history.length; update(); },
    onRender: current => {
      status.textContent = (current.turn() === "w" ? "White" : "Black") + " to move · " + cursor + " move(s) played";
    }
  });
  function update() { board.render(); }
  document.getElementById("back").addEventListener("click", () => {
    if (cursor > 0) { game.undo(); cursor--; update(); }
  });
  document.getElementById("forward").addEventListener("click", () => {
    if (cursor < history.length) { game.move(history[cursor]); cursor++; update(); }
  });
  document.getElementById("flip").addEventListener("click", () => board.flip());
  document.getElementById("reset").addEventListener("click", () => {
    game = new Chess(startFen); history = []; cursor = 0; update();
  });
})();
</script>
</body></html>
